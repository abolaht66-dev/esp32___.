name: ESP32 Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IDF target
        run: echo "IDF_TARGET=esp32" >> "$GITHUB_ENV"
        shell: bash

      - name: Show IDF target
        run: echo "IDF_TARGET='$IDF_TARGET'"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup ESP-IDF
        uses: espressif/setup-esp-idf@v1
        with:
          esp-idf-version: 'latest'
          # أو استخدم إصدار ثابت مثل: 'v5.1.2' / 'v4.4.8'

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py build

