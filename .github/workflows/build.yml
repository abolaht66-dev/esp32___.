name: ESP32 Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ضبط متغير البيئة بطريقة مضمونة
      - name: Set IDF target
        run: echo "IDF_TARGET=esp32" >> $GITHUB_ENV
        shell: bash

      - name: Show IDF target
        run: echo "IDF_TARGET='$IDF_TARGET'"

      # خطوات إعداد ESP-IDF هنا (مثال عام — حسب مشروعك قد تحتاج action/أوامر مختلفة)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ESP-IDF tools (placeholder)
        run: |
          python -m pip install --upgrade pip
          # ثبّت متطلبات مشروعك أو اتبع تعليمات esp-idf الخاصة بك هنا

      - name: Build
        run: |
          # تأكد من أنك قمت بتصدير بيئة esp-idf (حسب طريقة التثبيت)
          # source $HOME/esp/esp-idf/export.sh
          idf.py build
        shell: bash

